[project]
name = "ml-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "albumentations>=2.0.8",
    "click>=8.3.1",
    "colorama>=0.4.6",
    "dlib-bin>=20.0.0",
    "face-recognition>=1.3.0",
    "face-recognition-models>=0.3.0",
    "facenet-pytorch>=2.5.3",
    "faiss-cpu>=1.13.2",
    "joblib>=1.5.3",
    "kagglehub>=1.0.0",
    "matplotlib==3.10.8",
    "numpy>=2.4.3",
    "opencv-contrib-python>=4.13.0.92",
    "opencv-python>=4.13.0.92",
    "packaging>=26.0",
    "pillow>=12.1.1",
    "pytorch-metric-learning>=2.9.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "setuptools<=70",
    "tensorboard>=2.20.0",
    "threadpoolctl>=3.6.0",
    "timm>=1.0.26",
    "torch>=1.0.0",
    "torchvision<=1.0.0",
    "tqdm>=4.67.3",
]

[tool.uv]
override-dependencies = ["dlib>=19.0.0; sys_platform == 'never'"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
face-recognition-models = { git = "https://github.com/ageitgey/face_recognition_models" }
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
