[project]
name = "ml-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.1",
    "colorama>=0.4.6",
    "dlib-bin>=20.0.0",
    "face-recognition>=1.3.0",
    "face-recognition-models>=0.3.0",
    "joblib>=1.5.3",
    "numpy>=2.4.3",
    "opencv-python>=4.13.0.92",
    "packaging>=26.0",
    "pillow>=12.1.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "setuptools<=70",
    "threadpoolctl>=3.6.0",
    "tqdm>=4.67.3",
]

[tool.uv]
override-dependencies = ["dlib>=19.0.0; sys_platform == 'never'"]

[tool.uv.sources]
face-recognition-models = { git = "https://github.com/ageitgey/face_recognition_models" }
